<title>Roadmap de Nexus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Vista de docs/roadmap.md. El contenido se edita en roadmap.md y se arma con: node scripts/roadmap-vista.mjs -->
<style>
/* Una columna: para qué, una tarjeta por iniciativa con su camino en orden, y lo que falta probar. */
:root {
  --bg: #f9fafb; --surface: #ffffff; --surface-muted: #f3f4f6; --line: #e5e7eb;
  --fg: #111827; --fg-2: #374151; --fg-muted: #6b7280; --brand: #3b82f6;
  --ok-bg: #ecfdf5; --ok-line: #a7f3d0; --ok-ink: #065f46;
  --info-bg: #eff6ff; --info-line: #bfdbfe; --info-ink: #1e40af;
  --warn-bg: #fffbeb; --warn-line: #fde68a; --warn-ink: #92400e;
  --idle-bg: #f3f4f6; --idle-line: #e5e7eb; --idle-ink: #4b5563;
  --hi-bg: #fef2f2; --hi-line: #fecaca; --hi-ink: #b91c1c;
  --brand-ink: #ffffff; --brand-ink-2: #1d4ed8; --brand-bg: #eff6ff; --brand-line: #bfdbfe; --brand-soft: #93c5fd;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1220; --surface: #111827; --surface-muted: #1f2937; --line: #1f2937;
  --fg: #f9fafb; --fg-2: #e5e7eb; --fg-muted: #9ca3af; --brand: #60a5fa;
  --ok-bg: #064e3b40; --ok-line: #04785780; --ok-ink: #6ee7b7;
  --info-bg: #1e3a8a40; --info-line: #1d4ed880; --info-ink: #93c5fd;
  --warn-bg: #78350f40; --warn-line: #b4530980; --warn-ink: #fcd34d;
  --idle-bg: #1f2937; --idle-line: #374151; --idle-ink: #d1d5db;
  --hi-bg: #7f1d1d40; --hi-line: #b91c1c80; --hi-ink: #fca5a5;
  --brand-ink: #0b1220; --brand-ink-2: #93c5fd; --brand-bg: #1e3a8a33; --brand-line: #1d4ed880; --brand-soft: #1d4ed8;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b1220; --surface: #111827; --surface-muted: #1f2937; --line: #1f2937;
  --fg: #f9fafb; --fg-2: #e5e7eb; --fg-muted: #9ca3af; --brand: #60a5fa;
  --ok-bg: #064e3b40; --ok-line: #04785780; --ok-ink: #6ee7b7;
  --info-bg: #1e3a8a40; --info-line: #1d4ed880; --info-ink: #93c5fd;
  --warn-bg: #78350f40; --warn-line: #b4530980; --warn-ink: #fcd34d;
  --idle-bg: #1f2937; --idle-line: #374151; --idle-ink: #d1d5db;
  --hi-bg: #7f1d1d40; --hi-line: #b91c1c80; --hi-ink: #fca5a5;
  --brand-ink: #0b1220; --brand-ink-2: #93c5fd; --brand-bg: #1e3a8a33; --brand-line: #1d4ed880; --brand-soft: #1d4ed8;
  color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.55; margin: 0; }
main { max-width: 1040px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.head h1 { font-size: 24px; font-weight: 700; margin: 0; }
.head .meta { color: var(--fg-muted); font-size: 13px; }

#doc > h1, #doc > p:first-of-type { display: none; }
#doc h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-muted); margin: 32px 0 10px; }
#doc p, #doc li { color: var(--fg-2); }
#doc strong { color: var(--fg); font-weight: 600; }
#doc ol, #doc ul { padding-left: 22px; margin: 0; }
#doc li { margin: 6px 0; }
#doc code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
.tw { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
#doc table { border-collapse: collapse; width: 100%; }
#doc th { text-align: left; font-size: 12px; font-weight: 600; color: var(--fg-muted); padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-muted); white-space: nowrap; }
#doc td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--fg-2); }
#doc table.lista td:first-child { color: var(--fg); font-weight: 600; white-space: nowrap; }
#doc table.validar td:first-child { color: var(--fg-muted); font-variant-numeric: tabular-nums; width: 1%; }
#doc table.validar td:nth-child(2) { color: var(--fg); font-weight: 600; }
#doc table.pruebas { min-width: 780px; }
#doc table.pruebas td { font-size: 14px; }
#doc table.pruebas td:first-child { color: var(--fg-muted); font-variant-numeric: tabular-nums; width: 1%; }
#doc table.pruebas td:nth-child(2) { width: 1%; white-space: nowrap; }
#doc table.pruebas td:nth-child(3) { color: var(--fg); font-weight: 600; width: 20%; }
#doc table.pruebas td:nth-child(4) { width: 34%; }
.tabs { display: flex; gap: 4px; margin: 20px 0 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { font: inherit; font-size: 14px; font-weight: 600; color: var(--fg-muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--brand); }
.tabs button .n { display: inline-block; margin-left: 6px; font-size: 12px; font-weight: 600; color: var(--info-ink); background: var(--info-bg); border: 1px solid var(--info-line); border-radius: 999px; padding: 0 7px; }
.panel[hidden] { display: none; }
.subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 16px; }
.subtabs button { font: inherit; font-size: 13px; font-weight: 600; color: var(--fg-secondary); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
.subtabs button[aria-selected="true"] { color: var(--fg); border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
.subtabs button .n { margin-left: 6px; font-size: 11.5px; color: var(--info-ink); background: var(--info-bg); border: 1px solid var(--info-line); border-radius: 999px; padding: 0 6px; }
.subtabs button .ok { margin-left: 6px; font-size: 11.5px; color: var(--ok-ink); }
.subtabs button .espera { margin-left: 6px; font-size: 11.5px; }
.ini[hidden] { display: none; }
#doc .panel > h2:first-child { margin-top: 20px; }
#doc table.pruebas tr.listo td:not(:nth-child(2)) { color: var(--fg-muted); }
#doc .tw + p { margin-top: 10px; font-size: 13.5px; }
#doc > ul li { margin: 8px 0; }
.ini { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin: 0 0 12px; }
.ini h3 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 16px; font-weight: 650; margin: 0 0 4px; color: var(--fg); }
.ini > p { margin: 0 0 10px; color: var(--fg-muted); font-size: 14px; }
.ini h3.plegable { cursor: pointer; user-select: none; margin: 0; }
.ini h3.plegable::before { content: "\25B8"; color: var(--fg-muted); font-size: 12px; width: 12px; transition: transform .15s; }
.ini.abierta h3.plegable::before { transform: rotate(90deg); }
.ini.abierta h3.plegable { margin-bottom: 4px; }
.ini h3 .resumen { font-size: 12.5px; font-weight: 500; color: var(--fg-muted); }
.ini:not(.abierta) > .cuerpo { display: none; }
.ini:not(.abierta) { padding-top: 12px; padding-bottom: 12px; }
.ini ol { margin: 0; padding-left: 0; list-style: none; counter-reset: paso; }
.ini ol li { counter-increment: paso; position: relative; margin: 0; padding: 7px 0 7px 28px; border-top: 1px solid var(--line); }
.ini ol li::before { content: attr(data-n); position: absolute; left: 0; top: 8px; color: var(--fg-muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.ini ol li.sigue { color: var(--fg); font-weight: 600; }
.ini ol li.hecho { color: var(--fg-muted); }
.ini ol li .marca { display: inline-block; margin-right: 6px; font-size: 11.5px; font-weight: 600; border: 1px solid; border-radius: 999px; padding: 0 8px; vertical-align: 1px; }
.ini ol li .marca.hecho { color: var(--ok-ink); background: var(--ok-bg); border-color: var(--ok-line); }
.ini ol li .marca.curso { color: var(--warn-ink); background: var(--warn-bg); border-color: var(--warn-line); }
.ini ol li.sigue::after { content: "Lo siguiente"; display: block; width: fit-content; margin-top: 4px; font-size: 11.5px; font-weight: 600; color: var(--info-ink); background: var(--info-bg); border: 1px solid var(--info-line); border-radius: 999px; padding: 0 8px; }
.ini .tw { border: 0; border-radius: 0; margin: 0 -18px -16px; border-top: 1px solid var(--line); }
#doc a { color: var(--info-ink); }
#doc tr:last-child td { border-bottom: 0; }
.chip { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
.s-ok { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok-ink); }
.s-info { background: var(--info-bg); border-color: var(--info-line); color: var(--info-ink); }
.s-warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
.s-idle { background: var(--idle-bg); border-color: var(--idle-line); color: var(--idle-ink); }
/* Prioridad de un área de pruebas: alta en rojo, media en azul, baja en gris. */
.prio-alta { background: var(--hi-bg); border-color: var(--hi-line); color: var(--hi-ink); }
.prio-media { background: var(--info-bg); border-color: var(--info-line); color: var(--info-ink); }
.prio-baja { background: var(--idle-bg); border-color: var(--idle-line); color: var(--idle-ink); }
.subtabs button .p { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; background: currentColor; }
.subtabs .grupo { flex-basis: 100%; font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--fg-muted); margin: 6px 0 0; }
.subtabs .grupo:first-child { margin-top: 0; }
/* Resumen: la pestaña que abre primero, para quien no sigue el día a día. Una tarjeta por área, siempre abierta. */
.tarjetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin: 12px 0 0; }
.tarjetas .ini { margin: 0; display: flex; flex-direction: column; }
.ini.tarjeta h3 { margin: 0 0 8px; justify-content: space-between; }
#doc .ini.tarjeta ul { list-style: none; padding: 0; margin: 0; }
#doc .ini.tarjeta li { margin: 0; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
#doc .ini.tarjeta li strong { display: block; font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--fg-muted); }
#panel-resumen > p, #panel-resumen > ol { max-width: 760px; }
#panel-resumen > ol li { margin: 6px 0; }
/* El resumen nuevo (27 oct): sale del bloque «temas» de roadmap.md. Arriba lo que te toca; después lo que está en
   marcha, lo que falta arrancar y, en segundo plano, lo que ya funciona. */
.rs { max-width: 1080px; }
.rs-donde { font-size: 15px; color: var(--fg-2); margin: 4px 0 18px; }
.rs-h { font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-muted); margin: 26px 0 10px; border: 0; padding: 0; }
.rs-atencion { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 14px; padding: 16px 18px; }
.rs-atencion .rs-h { margin-top: 0; color: var(--warn-ink); }
.rs-numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
.rs-num-tile { font: inherit; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; color: var(--fg); }
.rs-num-tile b { display: block; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.rs-num-tile span { font-size: 13px; color: var(--fg-muted); }
.rs-toca { list-style: none; margin: 0; padding: 0; }
.rs-toca li { padding: 7px 0; border-top: 1px solid var(--warn-line); font-size: 14px; color: var(--fg); }
.rs-toca li:first-child { border-top: 0; }
.rs-toca li b { font-weight: 650; }
.rs-pq { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--warn-line); }
.rs-pq-t { font-size: 13px; color: var(--warn-ink); margin-right: 4px; }
/* «Lo que decides tú», por tema. */
.dg-tema { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin: 0 0 10px; }
.dg-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 15px; font-weight: 650; margin: 0 0 6px; color: var(--fg); }
.dg-tema ol { margin: 0; padding-left: 26px; }
.dg-tema ol li { margin: 6px 0; font-size: 14px; }
.dg-tema details { margin-top: 6px; color: var(--fg-muted); }
.dg-tema summary { cursor: pointer; font-size: 13px; }
.rs-pq button.chip { font-family: inherit; cursor: pointer; }
.rs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.rs-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.rs-card header { display: flex; align-items: flex-start; gap: 8px; }
.rs-card h3 { font-size: 15.5px; font-weight: 650; margin: 0; flex: 1; color: var(--fg); }
.rs-n { font-size: 12px; font-weight: 600; color: var(--fg-muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
.rs-res { font-size: 13px; color: var(--fg-muted); margin: 0; }
.rs-et { font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-muted); margin-top: 6px; }
.rs-hecho { list-style: none; margin: 0; padding: 0; }
.rs-hecho li { font-size: 13.5px; padding: 3px 0; color: var(--fg-2); }
.rs-f { display: inline-block; min-width: 46px; font-size: 12px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.rs-mas { font: inherit; font-size: 12.5px; color: var(--info-ink); background: none; border: 0; padding: 2px 0; cursor: pointer; }
.rs-sigue { font-size: 14px; font-weight: 600; color: var(--fg); margin: 0; }
.rs-card footer { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--fg-muted); }
.rs-card footer .rs-ver, .rs-fila .rs-ver { margin-left: auto; font: inherit; font-size: 12.5px; color: var(--info-ink); background: none; border: 0; padding: 0; cursor: pointer; }
.rs-lista { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.rs-fila { display: grid; grid-template-columns: minmax(180px, 1.1fr) 2fr auto; gap: 4px 16px; align-items: baseline; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 13.5px; }
.rs-fila:first-child { border-top: 0; }
.rs-fila .rs-nom { font-weight: 600; color: var(--fg); }
.rs-fila .rs-falta { color: var(--fg-2); }
.rs-fila .rs-falta i { font-style: normal; color: var(--fg-muted); }
.rs-fila .rs-ult { grid-column: 2; font-size: 12.5px; color: var(--fg-muted); }
.rs-fila .rs-der { grid-row: 1; grid-column: 3; display: flex; gap: 8px; align-items: baseline; white-space: nowrap; }
@media (max-width: 640px) {
  .rs-fila { grid-template-columns: 1fr; }
  .rs-fila .rs-ult, .rs-fila .rs-der { grid-column: 1; grid-row: auto; }
}
/* La línea de tiempo (19 nov): la pestaña que abre primero. Una línea vertical: arriba lo hecho, del más viejo al más
   nuevo, con su fecha; la marca «Hoy»; abajo lo que sigue, numerado por prioridad y sin fechas. Sale del bloque «linea».
   Cada iniciativa tiene su color (--ini-*, inyectado desde el bloque con su versión clara y oscura). */
#panel-linea > h2:first-child { display: none; }
.ln-wrap { --col-f: 92px; --col-p: 28px; max-width: 900px; }
.ln-top { display: grid; gap: 12px; margin: 18px 0 16px; }
.ln-donde { margin: 0; font-size: 15px; color: var(--fg-2); max-width: 70ch; }
.ln-estado { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 13.5px; color: var(--fg-muted); }
.ln-estado b { color: var(--fg); font-weight: 650; }
.sha { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--fg-2); background: var(--surface-muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
.ln-acciones { display: flex; flex-wrap: wrap; gap: 8px; }
.ln-btn { font: inherit; font-size: 13px; font-weight: 600; color: var(--fg-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.ln-btn.prim { color: var(--brand-ink); background: var(--brand); border-color: var(--brand); }
.ln-btn:focus-visible, .ln-cab:focus-visible, .ln-fil:focus-visible, .ln-cta:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.ln-filtros { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.ln-fil { font: inherit; font-size: 13px; font-weight: 600; color: var(--fg-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.ln-fil i { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--fg-muted)); }
.ln-fil span { font-size: 11.5px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.ln-fil[aria-pressed="true"] { color: var(--fg); border-color: var(--c, var(--brand)); box-shadow: inset 0 0 0 1px var(--c, var(--brand)); }
.ln { position: relative; margin: 0; padding: 6px 0; list-style: none; }
.ln::before { content: ""; position: absolute; top: 0; bottom: 0; left: calc(var(--col-f) + var(--col-p) / 2 - 1px); width: 2px; background: var(--line); }
.ln.futuro::before { background: repeating-linear-gradient(to bottom, var(--fg-muted) 0 6px, transparent 6px 12px); opacity: .55; }
.ln-fila { position: relative; display: grid; grid-template-columns: var(--col-f) var(--col-p) minmax(0, 1fr); align-items: start; }
.ln-mes { padding: 18px 0 6px; }
.ln-mes .ln-p::after { content: ""; display: block; width: 10px; height: 10px; margin: 6px auto 0; background: var(--bg); border: 2px solid var(--fg-muted); border-radius: 2px; transform: rotate(45deg); }
.ln-mes h3 { margin: 0; padding-top: 2px; font-size: 12px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--fg-muted); }
.ln-mes h3 span { margin-left: 8px; font-weight: 500; letter-spacing: 0; text-transform: none; }
.ln-f { padding: 12px 10px 0 0; text-align: right; font-size: 12.5px; color: var(--fg-muted); font-variant-numeric: tabular-nums; line-height: 1.3; }
.ln.futuro .ln-f { font-size: 15px; font-weight: 700; color: var(--fg-2); padding-top: 10px; }
.ln-p { position: relative; }
.ln-item .ln-p::after { content: ""; display: block; width: 12px; height: 12px; margin: 14px auto 0; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px var(--bg); }
.ln.futuro .ln-item .ln-p::after { background: var(--bg); border: 2.5px solid var(--c); width: 13px; height: 13px; }
.ln-item { padding: 3px 0; }
.ln-item[hidden], .ln-mes[hidden] { display: none; }
.ln-caja { min-width: 0; border: 1px solid transparent; border-radius: 10px; }
.ln-item.abierto .ln-caja { background: var(--surface); border-color: var(--line); }
.ln-cab { display: block; width: 100%; font: inherit; text-align: left; color: inherit; background: none; border: 0; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
.ln-cab:hover { background: var(--surface); }
.ln-item.abierto .ln-cab:hover { background: none; }
.ln-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px; color: var(--fg-muted); }
.ln-ini { font-weight: 650; color: var(--c, var(--fg-muted)); }
.ln-t { display: block; margin-top: 1px; font-size: 15px; font-weight: 650; color: var(--fg); text-wrap: balance; }
.ln-t::after { content: "\25B8"; display: inline-block; margin-left: 7px; font-size: 11px; color: var(--fg-muted); transition: transform .15s; }
.ln-item.abierto .ln-t::after { transform: rotate(90deg); }
.ln-d { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; font-size: 13.5px; color: var(--fg-muted); }
.ln-item.abierto .ln-d { display: none; }
.ln-det { padding: 0 12px 12px; display: grid; gap: 10px; }
.ln-det[hidden] { display: none; }
.ln-que { margin: 0; font-size: 14.5px; color: var(--fg-2); max-width: 68ch; }

@keyframes ln-late { 0% { box-shadow: 0 0 0 4px var(--bg), 0 0 0 4px var(--brand-soft); } 70%, 100% { box-shadow: 0 0 0 4px var(--bg), 0 0 0 12px transparent; } }

<main>
  <div class="head"><h1>Roadmap de Nexus</h1><span class="meta" id="meta"></span></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <article id="doc"></article>
</main>
<button class="ln-cta" id="ir-hoy" type="button" hidden><span aria-hidden="true">↓</span>Ir a hoy</button>

<script type="text/plain" id="md">@@ROADMAP_MD@@</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function () {
  var md = document.getElementById('md').textContent;
  var doc = document.getElementById('doc');
  doc.innerHTML = marked.parse(md, { gfm: true });

  var corte = md.match(/\*\*Corte:\*\*\s*([0-9-]+)/);
  if (corte) document.getElementById('meta').textContent = 'Al ' + corte[1];

  var TONOS = { 'Validado': 's-ok', 'En producción': 's-info', 'Por desplegar': 's-warn', 'Por empezar': 's-idle', 'Propuesta': 's-warn', 'En curso': 's-warn', 'Por decidir': 's-idle' };
  doc.querySelectorAll('span.estado').forEach(function (sp) {
    var e = sp.textContent.trim(); sp.className = 'chip estado ' + (TONOS[e] || 's-idle');
  });
  // La prioridad de un área de pruebas (Alta · Media · Baja), como chip al lado del título.
  doc.querySelectorAll('span.prioridad').forEach(function (sp) {
    var p = sp.textContent.trim().toLowerCase(); sp.className = 'chip prio prio-' + p; sp.setAttribute('data-prio', p); sp.textContent = 'Prioridad ' + p;
  });
  doc.querySelectorAll('table').forEach(function (t) {
    var w = document.createElement('div'); w.className = 'tw'; t.parentNode.insertBefore(w, t); w.appendChild(t);
    var th = t.querySelector('thead th'), primera = th ? th.textContent.trim() : '';
    var cabeza = Array.prototype.map.call(t.querySelectorAll('thead th'), function (x) { return x.textContent.trim(); });
    if (cabeza.indexOf('Estado') >= 0) {
      // Las pruebas: el estado como chip (↻ Validar otra vez · Por validar · ⏳ No probar todavía · ✓ Validado); lo validado, en gris.
      t.classList.add('pruebas');
      t.querySelectorAll('tbody tr').forEach(function (tr) {
        var td = tr.children[1]; if (!td) return;
        var e = td.textContent.trim();
        var tono = /^✓/.test(e) ? 's-ok' : /^↻/.test(e) ? 's-warn' : /^⏳/.test(e) ? 's-info' : 's-idle';
        td.innerHTML = '<span class="chip ' + tono + '">' + td.innerHTML + '</span>';
        if (tono === 's-ok') tr.classList.add('listo'); else if (tono === 's-info') tr.classList.add('arreglo');
      });
      // Orden: lo que hay que volver a validar, lo que falta, lo que estoy arreglando, y lo validado al final, por fecha.
      var MESES = { ene: 1, feb: 2, mar: 3, abr: 4, may: 5, jun: 6, jul: 7, ago: 8, sep: 9, oct: 10, nov: 11, dic: 12 };
      var tb = t.querySelector('tbody');
      // Una tabla sin filas no trae tbody: sin esta salida, el script muere y la página queda sin pestañas (22 oct).
      if (!tb) return;
      var filas = Array.prototype.slice.call(tb.children).map(function (tr, i) {
        var e = tr.children[1] ? tr.children[1].textContent.trim() : '';
        var g = /^↻/.test(e) ? 0 : /^✓/.test(e) ? 3 : /^⏳/.test(e) ? 2 : 1;
        var f = e.match(/(\d{1,2})\s+([a-z]{3})/);
        var dia = f ? (MESES[f[2]] || 0) * 100 + Number(f[1]) : 0;
        return { tr: tr, g: g, dia: dia, i: i };
      });
      filas.sort(function (a, b) { return a.g - b.g || (a.g === 3 ? a.dia - b.dia : 0) || a.i - b.i; });
      filas.forEach(function (x) { tb.appendChild(x.tr); });
    } else t.classList.add(primera === '#' ? 'validar' : 'lista');
  });
  // Cada iniciativa (h3 y lo que sigue hasta el próximo encabezado) en su tarjeta.
  doc.querySelectorAll('h3').forEach(function (h) {
    var card = document.createElement('section'); card.className = 'ini';
    // Las del «Resumen» son tarjetas que no se pliegan.
    var antes = h.previousElementSibling;
    while (antes && antes.tagName !== 'H2') antes = antes.previousElementSibling;
    if (antes && /^\s*Resumen$/i.test(antes.textContent)) card.classList.add('tarjeta');
    h.parentNode.insertBefore(card, h);
    var el = h;
    while (el && !(el !== h && /^H[23]$/.test(el.tagName))) { var sig = el.nextElementSibling; card.appendChild(el); el = sig; }
  });
  // Marcas de cada paso: [hecho] y [en curso]; «Lo siguiente» va en el primero que falta.
  doc.querySelectorAll('.ini ol').forEach(function (ol) {
    var marcado = false;
    var items = Array.prototype.slice.call(ol.querySelectorAll(':scope > li'));
    items.forEach(function (li, i) { li.setAttribute('data-n', String(i + 1)); });
    // Lo que falta primero, en su orden; lo hecho al final, en el orden en que se hizo.
    items.filter(function (li) { return !/^\s*\[hecho\]/.test(li.innerHTML); })
      .concat(items.filter(function (li) { return /^\s*\[hecho\]/.test(li.innerHTML); }))
      .forEach(function (li) { ol.appendChild(li); });
    ol.querySelectorAll(':scope > li').forEach(function (li) {
      var h = li.innerHTML;
      if (/^\s*\[hecho\]\s*/.test(h)) { li.innerHTML = h.replace(/^\s*\[hecho\]\s*/, '<span class="marca hecho">Hecho</span>'); li.classList.add('hecho'); return; }
      if (/^\s*\[en curso\]\s*/.test(h)) { li.innerHTML = h.replace(/^\s*\[en curso\]\s*/, '<span class="marca curso">En curso</span>'); return; }
      if (!marcado) { li.classList.add('sigue'); marcado = true; }
    });
  });

  // Plegables: se abre solo lo que pide revisión (un paso en curso, algo que no está en producción o validaciones
  // pendientes); lo que está en producción y sin nada que hacer queda cerrado, con su resumen al lado del título.
  doc.querySelectorAll('.ini').forEach(function (card) {
    var h = card.querySelector('h3'); if (!h) return;
    var cuerpo = document.createElement('div'); cuerpo.className = 'cuerpo';
    while (h.nextSibling) cuerpo.appendChild(h.nextSibling);
    card.appendChild(cuerpo);
    if (card.classList.contains('tarjeta')) { card.classList.add('abierta'); return; }
    var chip = h.querySelector('.chip.estado'), estado = chip ? chip.textContent.trim() : '';
    var pasos = cuerpo.querySelectorAll('ol > li'), hechos = cuerpo.querySelectorAll('ol > li.hecho').length;
    var enCurso = cuerpo.querySelectorAll('ol > li .marca.curso').length;
    var pruebas = cuerpo.querySelectorAll('table.pruebas tbody tr'), pendientes = cuerpo.querySelectorAll('table.pruebas tbody tr:not(.listo)').length;
    var revisar = enCurso > 0 || pendientes > 0 || (estado && !/^(En producción|Validado)$/.test(estado)) || (!estado && !pruebas.length);
    var r = document.createElement('span'); r.className = 'resumen';
    if (pruebas.length) r.textContent = pendientes ? pendientes + ' por revisar' : 'todo validado';
    else if (pasos.length) r.textContent = (hechos ? hechos + ' de ' + pasos.length + ' hechos' : pasos.length + ' pasos') + (enCurso ? ' · ' + enCurso + ' en curso' : '');
    if (r.textContent) h.appendChild(r);
    h.classList.add('plegable'); h.setAttribute('role', 'button'); h.tabIndex = 0;
    if (revisar) card.classList.add('abierta');
    h.setAttribute('aria-expanded', String(revisar));
    function cambiar() { var a = card.classList.toggle('abierta'); h.setAttribute('aria-expanded', String(a)); }
    h.addEventListener('click', function (e) { if (e.target.closest('a')) return; cambiar(); });
    h.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cambiar(); } });
  });

  // Las tarjetas seguidas del Resumen, en una grilla.
  var sueltas = Array.prototype.slice.call(doc.querySelectorAll('.ini.tarjeta'));
  sueltas.forEach(function (card) {
    var prev = card.previousElementSibling;
    if (prev && prev.classList.contains('tarjetas')) { prev.appendChild(card); return; }
    var g = document.createElement('div'); g.className = 'tarjetas';
    card.parentNode.insertBefore(g, card); g.appendChild(card);
  });

  // Siete pestañas: el resumen, lo que falta, las pruebas para personas, las pruebas con IA, lo que le pides al equipo, lo hecho y cómo funciona Nexus. Cada «##» va a la suya.
  var PESTANAS = [
    { id: 'linea', nombre: 'Línea de tiempo', h2: /^\s*Línea de tiempo$/i },
    { id: 'resumen', nombre: 'Resumen', h2: /^\s*Resumen$/i },
    { id: 'roadmap', nombre: 'Roadmap' },
    { id: 'validar', nombre: 'Pruebas para personas', h2: /^\s*Pruebas para personas$/i },
    { id: 'claude', nombre: 'Pruebas con IA', h2: /^\s*Pruebas con IA$/i },
    { id: 'equipo', nombre: 'Lo que pides al equipo', h2: /pides al equipo/i },
    { id: 'hecho', nombre: 'Hecho', h2: /^\s*Hecho$/i },
    { id: 'como', nombre: 'Cómo funciona Nexus', h2: /^\s*(Cómo funciona Nexus|Cómo se mantiene este roadmap)$/i },
  ];
  var paneles = {};
  PESTANAS.forEach(function (p) { var d = document.createElement('div'); d.className = 'panel'; d.id = 'panel-' + p.id; paneles[p.id] = d; });
  var actual = 'roadmap';
  Array.prototype.slice.call(doc.children).forEach(function (el) {
    // El título y la línea del corte ya están en la cabecera.
    if (el.tagName === 'H1' || (el.tagName === 'P' && /^\s*Corte:/.test(el.textContent))) { el.remove(); return; }
    if (el.tagName === 'H2') {
      var p = PESTANAS.filter(function (x) { return x.h2 && x.h2.test(el.textContent); })[0];
      actual = p ? p.id : 'roadmap';
    }
    paneles[actual].appendChild(el);
  });
  PESTANAS.forEach(function (p) { doc.appendChild(paneles[p.id]); });
  var faltan = paneles.validar.querySelectorAll('table.pruebas tbody tr:not(.listo):not(.arreglo)').length;
  var MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  var MES_LARGO = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  function fecha(iso) { var p = iso.split('-'); return Number(p[2]) + ' ' + MES[Number(p[1]) - 1]; }
  // La línea de tiempo: el bloque «linea» (JSON). scripts/roadmap-vista.mjs lo valida antes de armar la vista.
  var linea = null, lineaRevisar = function () {}, lineaIrAHoy = null;
  (function () {
    var code = paneles.linea.querySelector('code.language-linea');
    if (!code) return;
    try { linea = JSON.parse(code.textContent); } catch (e) { return; }
    var pre = code.closest('pre') || code; pre.remove();
  })();
  pintarLinea();
  pintarResumen();
  // Las pestañas de pruebas van por tema (agrupadas por prioridad si la tienen): una tarjeta a la vez, con cuántas faltan; abre en la primera con algo pendiente.
  [paneles.validar, paneles.claude].forEach(function (panel) {
    var cards = Array.prototype.slice.call(panel.querySelectorAll('.ini'));
    if (cards.length < 2) return;
    var nav = document.createElement('nav'); nav.className = 'subtabs'; nav.setAttribute('role', 'tablist');
    cards[0].parentNode.insertBefore(nav, cards[0]);
    var ultimaPrio = '';
    var botones = cards.map(function (card, i) {
      card.classList.add('abierta');
      var h = card.querySelector('h3');
      var nombre = (h.firstChild && h.firstChild.textContent ? h.firstChild.textContent : h.textContent).replace(/^\s*\d+\s*·\s*/, '').trim();
      var pend = card.querySelectorAll('table.pruebas tbody tr:not(.listo):not(.arreglo)').length;
      var pr = card.querySelector('.prio'), prio = pr ? pr.getAttribute('data-prio') : '';
      if (prio && prio !== ultimaPrio) { var g = document.createElement('div'); g.className = 'grupo'; g.textContent = 'Prioridad ' + prio; nav.appendChild(g); ultimaPrio = prio; }
      var b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'tab');
      if (prio) { var d = document.createElement('span'); d.className = 'p prio-' + prio; b.appendChild(d); }
      b.appendChild(document.createTextNode(nombre));
      var espera = card.querySelectorAll('table.pruebas tbody tr.arreglo').length;
      var m = document.createElement('span'); m.className = pend ? 'n' : espera ? 'espera' : 'ok';
      m.textContent = pend ? String(pend) : espera ? '⏳' : '✓'; b.appendChild(m);
      b.addEventListener('click', function () { mostrar(i); });
      nav.appendChild(b);
      return { b: b, pend: pend };
    });
    function mostrar(i) {
      cards.forEach(function (c, j) { c.hidden = j !== i; botones[j].b.setAttribute('aria-selected', String(j === i)); });
    }
    var primera = botones.findIndex(function (x) { return x.pend > 0; });
    mostrar(primera < 0 ? 0 : primera);
  });
  var tabs = document.getElementById('tabs');
  function elegir(id, guardar) {
    PESTANAS.forEach(function (p) {
      paneles[p.id].hidden = p.id !== id;
      var b = document.getElementById('tab-' + p.id); if (b) b.setAttribute('aria-selected', String(p.id === id));
    });
    if (guardar) { try { history.replaceState(null, '', '#' + id); } catch (e) {} }
    lineaRevisar();
  }
  PESTANAS.forEach(function (p) {
    var b = document.createElement('button');
    b.id = 'tab-' + p.id; b.type = 'button'; b.setAttribute('role', 'tab');
    b.textContent = p.nombre;
    if (p.id === 'validar' && faltan) { var n = document.createElement('span'); n.className = 'n'; n.textContent = faltan + ' por validar'; b.appendChild(n); }
    b.addEventListener('click', function () { elegir(p.id, true); window.scrollTo(0, 0); });
    tabs.appendChild(b);
  });
  // El resumen sale del bloque «temas» (JSON) de roadmap.md; scripts/roadmap-vista.mjs lo valida antes de armar la vista.
  function pintarResumen() {
    var code = paneles.resumen.querySelector('code.language-temas');
    if (!code) return;
    var datos;
    try { datos = JSON.parse(code.textContent); } catch (e) { return; }
    // Las preguntas: «Lo que decides tú», con ✓ las respondidas.
    function seccion(re) {

    var colocados = {};
    function pasosDe(t) { var p = linea.sigue.filter(function (s) { return s.tema === t.n; }); p.forEach(function (s) { colocados[s._n] = true; }); return p; }

    var raiz = nodo('div', 'ln-wrap cr-wrap');
    var top = nodo('div', 'ln-top');
    if (bloqueTemas.dondeVamos) top.appendChild(nodo('p', 'ln-donde', bloqueTemas.dondeVamos));
    var est = nodo('div', 'ln-estado');
    var b1 = nodo('span'); b1.innerHTML = 'Hoy es <b>' + fecha(linea.hoy) + '</b>'; est.appendChild(b1);
    var b2 = nodo('span'); b2.appendChild(document.createTextNode('Producción corre ')); b2.appendChild(nodo('code', 'sha', linea.produccion)); est.appendChild(b2);
    var enCurso = temas.filter(function (t) { return t.estado === 'en-curso'; }).sort(porPrio);
    var propuesta = temas.filter(function (t) { return t.estado === 'propuesta'; }).sort(porPrio);
    est.appendChild(nodo('span', null, enCurso.length + ' temas en ejecución · ' + propuesta.length + ' por arrancar'));
    top.appendChild(est);
    raiz.appendChild(top);

    var ejec = seccion('En ejecución', 'Un carril por tema, en orden de prioridad. De izquierda a derecha, lo que falta resolver. Toca una tarjeta para ver el detalle.');
    ejec.id = 'hoy';
    enCurso.forEach(function (t) { ejec.appendChild(carril(t, pasosDe(t))); });
    raiz.appendChild(ejec);
    if (propuesta.length) {
      var viene = seccion('Lo que viene', 'Temas que todavía no arrancan, sin fechas: cada uno se hace cuando lo pones a correr.', 'tenue');
      propuesta.forEach(function (t) { viene.appendChild(carril(t, pasosDe(t))); });
      raiz.appendChild(viene);
    }
    // Lo pendiente de la línea que cae en un tema que ya funciona, o en ninguno: es trabajo por hacer, no se esconde.
    var resto = linea.sigue.filter(function (s) { return !colocados[s._n]; });
    if (resto.length) {
      var tamb = seccion('También pendiente', 'Lo que falta en temas que ya funcionan.', 'tenue');
      var claves = [];
      resto.forEach(function (s) { var k = s.tema == null ? 'x' : s.tema; if (claves.indexOf(k) < 0) claves.push(k); });
      claves.forEach(function (k) {
        var t = k === 'x' ? null : temas.filter(function (x) { return x.n === k; })[0] || null;
        tamb.appendChild(carril(t, resto.filter(function (s) { return (s.tema == null ? 'x' : s.tema) === k; })));
      });
      raiz.appendChild(tamb);
    }

    // El desplegable de lo que ya pasó, cerrado por defecto (abierto o cerrado se recuerda en este navegador).
    var pasado = nodo('details', 'ln-pasado');
    var sm = nodo('summary');
    sm.appendChild(nodo('span', 'ln-pasado-t', 'Lo que ya pasó'));
    var primero = linea.hecho[0], ultimo = linea.hecho[linea.hecho.length - 1];
    sm.appendChild(nodo('span', 'ln-pasado-n', linea.hecho.length + ' hitos' + (primero ? ', del ' + fecha(primero.fecha) + ' ' + primero.fecha.slice(0, 4) + ' al ' + fecha(ultimo.hasta || ultimo.fecha) : '') + ', y los temas que ya funcionan'));
    pasado.appendChild(sm);
    var cuerpo = nodo('div', 'ln-pasado-c');
    var acc = nodo('div', 'ln-acciones');
    var todo = nodo('button', 'ln-btn', 'Abrir todo'); todo.type = 'button'; acc.appendChild(todo);
    cuerpo.appendChild(acc);
    var fil = nodo('div', 'ln-filtros'); fil.setAttribute('role', 'group'); fil.setAttribute('aria-label', 'Ver una iniciativa');
    cuerpo.appendChild(fil);
    var hecho = nodo('ol', 'ln'), mesActual = '', porMes = {};
    linea.hecho.forEach(function (h) {
      var m = h.fecha.slice(0, 7);
      if (m !== mesActual) {
        mesActual = m; var mesLi = nodo('li', 'ln-fila ln-mes'); mesLi.setAttribute('data-mes', m);
        mesLi.appendChild(nodo('div')); var pp = nodo('div', 'ln-p'); pp.setAttribute('aria-hidden', 'true'); mesLi.appendChild(pp);
        var h3 = nodo('h3', null, MES_LARGO[Number(m.slice(5)) - 1] + ' ' + m.slice(0, 4)); h3.appendChild(nodo('span')); mesLi.appendChild(h3);
        hecho.appendChild(mesLi); porMes[m] = mesLi;
      }
      var li = item(h); li.setAttribute('data-mes', m); hecho.appendChild(li);
    });
    cuerpo.appendChild(hecho);
    var hoyM = nodo('div', 'ln-fila ln-hoy');
    hoyM.appendChild(nodo('div', 'ln-f', 'Hoy')); var ph = nodo('div', 'ln-p'); ph.setAttribute('aria-hidden', 'true'); hoyM.appendChild(ph);
    var hc = nodo('div', 'ln-hoy-caja');
    hc.appendChild(nodo('strong', null, fecha(linea.hoy)));
    var pp1 = nodo('p'); pp1.appendChild(document.createTextNode('Producción corre ')); pp1.appendChild(nodo('code', 'sha', linea.produccion));
    pp1.appendChild(document.createTextNode(': todo lo de arriba está en producción, salvo lo marcado como apagado o plan. Lo que sigue está en «En ejecución».')); hc.appendChild(pp1);
    hoyM.appendChild(hc); cuerpo.appendChild(hoyM);
    var ya = temas.filter(function (t) { return t.estado === 'funciona' || t.estado === 'terminado'; });
    if (ya.length) {
      cuerpo.appendChild(nodo('h3', 'cr-h3', 'Los temas que ya funcionan'));
      var lista = nodo('div', 'rs-lista');
      ya.forEach(function (t) {
        var f = nodo('div', 'rs-fila');
        f.appendChild(nodo('div', 'rs-nom', t.nombre));
        var falta = nodo('div', 'rs-falta');
        if (t.sigue) { falta.appendChild(nodo('i', null, 'Falta: ')); falta.appendChild(document.createTextNode(t.sigue)); } else falta.textContent = 'Nada pendiente.';
        f.appendChild(falta);
        var e = EST_TEMA[t.estado] || ['', 's-ok'];
        var der = nodo('div', 'rs-der'); der.appendChild(nodo('span', 'chip ' + e[1], e[0])); f.appendChild(der);
        lista.appendChild(f);
      });
      cuerpo.appendChild(lista);
    }
    pasado.appendChild(cuerpo);
    try { pasado.open = localStorage.getItem('roadmap-pasado') === '1'; } catch (e) {}
    pasado.addEventListener('toggle', function () { try { localStorage.setItem('roadmap-pasado', pasado.open ? '1' : '0'); } catch (e) {} lineaRevisar(); });
    raiz.appendChild(pasado);
    paneles.linea.appendChild(raiz);

    // El filtro de lo que ya pasó: una iniciativa a la vez; otro clic vuelve a todas. Se recuerda en este navegador.
    var cuenta = {}; items.forEach(function (li) { var k = li.getAttribute('data-ini'); cuenta[k] = (cuenta[k] || 0) + 1; });
    var botones = [], actualFiltro = '';
    function boton(id, nombre, n) {
      var b = nodo('button', 'ln-fil'); b.type = 'button'; b.setAttribute('aria-pressed', 'false');
      if (id) { b.style.setProperty('--c', 'var(--ini-' + id + ')'); b.appendChild(nodo('i')); }
      b.appendChild(document.createTextNode(nombre)); b.appendChild(nodo('span', null, String(n)));
      b.addEventListener('click', function () { filtrar(actualFiltro === id || !id ? '' : id, true); });
      botones.push({ id: id, b: b }); fil.appendChild(b);
    }
    boton('', 'Todas', items.length);
    linea.iniciativas.forEach(function (i) { if (cuenta[i.id]) boton(i.id, i.nombre, cuenta[i.id]); });
    function filtrar(id, guardar) {
      actualFiltro = id;
      botones.forEach(function (x) { x.b.setAttribute('aria-pressed', String(x.id === id)); });
      items.forEach(function (li) { li.hidden = !!id && li.getAttribute('data-ini') !== id; });
      Object.keys(porMes).forEach(function (m) {
        var n = hecho.querySelectorAll('.ln-item[data-mes="' + m + '"]:not([hidden])').length;
        porMes[m].hidden = n === 0; porMes[m].querySelector('h3 span').textContent = n === 1 ? '1 hito' : n + ' hitos';
      });
      if (guardar) { try { localStorage.setItem('roadmap-filtro', id); } catch (e) {} }
    }
    var guardado = ''; try { guardado = localStorage.getItem('roadmap-filtro') || ''; } catch (e) {}
    filtrar(cuenta[guardado] ? guardado : '', false);
    todo.addEventListener('click', function () {
      var abrir = todo.textContent === 'Abrir todo';
      items.forEach(function (li) { if (!li.hidden) li._abrir(abrir); });
      todo.textContent = abrir ? 'Cerrar todo' : 'Abrir todo';
    });

    // «Ir a hoy» lleva a «En ejecución»: el botón fijo aparece cuando esa sección no está a la vista.
    var cta = document.getElementById('ir-hoy');
    var suave = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    function irAHoy() {
      if (paneles.linea.hidden) elegir('linea', true);
      ejec.scrollIntoView({ block: 'start', behavior: suave ? 'smooth' : 'auto' });
    }
    cta.addEventListener('click', irAHoy);
    var pend = false;
    function revisar() {
      pend = false;
      if (paneles.linea.hidden) { cta.hidden = true; return; }
      var r = ejec.getBoundingClientRect(), alto = window.innerHeight || document.documentElement.clientHeight;
      cta.hidden = r.bottom > 0 && r.top < alto;
      cta.classList.toggle('arriba', r.bottom <= 0);
    }
    function pedir() { if (!pend) { pend = true; requestAnimationFrame(revisar); } }
    window.addEventListener('scroll', pedir, { passive: true }); window.addEventListener('resize', pedir);
    lineaRevisar = pedir;
    lineaIrAHoy = irAHoy;
  }

  var inicial = (location.hash || '').slice(1);
  if (inicial === 'hoy' && lineaIrAHoy) { elegir('linea', false); setTimeout(lineaIrAHoy, 0); }
  else elegir(PESTANAS.some(function (p) { return p.id === inicial; }) ? inicial : 'linea', false);
  lineaRevisar();
})();
</script>
