<!-- Vista de docs/roadmap.md. El contenido se edita en roadmap.md y se arma con: node scripts/roadmap-vista.mjs -->
<script>
  // Elías, 21 nov: «quiero ver mi roadmap blanco». Abre en claro siempre; el botón de arriba pasa a oscuro y se recuerda.
  (function () {
    var t = 'light';
    try { t = localStorage.getItem('roadmap-tema') === 'dark' ? 'dark' : 'light'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);

    pintar();
    b.addEventListener('click', function () {
      var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
      try { localStorage.setItem('roadmap-tema', t); } catch (e) {}
      pintar();

  })();
</script>
<button class="ln-cta" id="ir-hoy" type="button" hidden><span aria-hidden="true">↓</span>Ir a hoy</button>

<script type="text/plain" id="md">@@ROADMAP_MD@@</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function () {
  var md = document.getElementById('md').textContent;
  var doc = document.getElementById('doc');
  doc.innerHTML = marked.parse(md, { gfm: true });

  var corte = md.match(/\*\*Corte:\*\*\s*([0-9-]+)/);
  if (corte) document.getElementById('meta').textContent = 'Al ' + corte[1];

  var TONOS = { 'Validado': 's-ok', 'En producción': 's-info', 'Por desplegar': 's-warn', 'Por empezar': 's-idle', 'Propuesta': 's-warn', 'En curso': 's-warn', 'Por decidir': 's-idle' };
  doc.querySelectorAll('span.estado').forEach(function (sp) {
    var e = sp.textContent.trim(); sp.className = 'chip estado ' + (TONOS[e] || 's-idle');
  });
  // La prioridad de un área de pruebas (Alta · Media · Baja), como chip al lado del título.
  doc.querySelectorAll('span.prioridad').forEach(function (sp) {
    var p = sp.textContent.trim().toLowerCase(); sp.className = 'chip prio prio-' + p; sp.setAttribute('data-prio', p); sp.textContent = 'Prioridad ' + p;
  });
  doc.querySelectorAll('table').forEach(function (t) {
    var w = document.createElement('div'); w.className = 'tw'; t.parentNode.insertBefore(w, t); w.appendChild(t);
    var th = t.querySelector('thead th'), primera = th ? th.textContent.trim() : '';
    var cabeza = Array.prototype.map.call(t.querySelectorAll('thead th'), function (x) { return x.textContent.trim(); });
    if (cabeza.indexOf('Estado') >= 0) {
      // Las pruebas: el estado como chip (↻ Validar otra vez · Por validar · ⏳ No probar todavía · ✓ Validado); lo validado, en gris.
      t.classList.add('pruebas');
      t.querySelectorAll('tbody tr').forEach(function (tr) {
        var td = tr.children[1]; if (!td) return;
        var e = td.textContent.trim();
        var tono = /^✓/.test(e) ? 's-ok' : /^↻/.test(e) ? 's-warn' : /^⏳/.test(e) ? 's-info' : 's-idle';
        td.innerHTML = '<span class="chip ' + tono + '">' + td.innerHTML + '</span>';
        if (tono === 's-ok') tr.classList.add('listo'); else if (tono === 's-info') tr.classList.add('arreglo');
      });
      // Orden: lo que hay que volver a validar, lo que falta, lo que estoy arreglando, y lo validado al final, por fecha.
      var MESES = { ene: 1, feb: 2, mar: 3, abr: 4, may: 5, jun: 6, jul: 7, ago: 8, sep: 9, oct: 10, nov: 11, dic: 12 };
      var tb = t.querySelector('tbody');
      // Una tabla sin filas no trae tbody: sin esta salida, el script muere y la página queda sin pestañas (22 oct).
      if (!tb) return;
      var filas = Array.prototype.slice.call(tb.children).map(function (tr, i) {
        var e = tr.children[1] ? tr.children[1].textContent.trim() : '';
        var g = /^↻/.test(e) ? 0 : /^✓/.test(e) ? 3 : /^⏳/.test(e) ? 2 : 1;
        var f = e.match(/(\d{1,2})\s+([a-z]{3})/);
        var dia = f ? (MESES[f[2]] || 0) * 100 + Number(f[1]) : 0;
        return { tr: tr, g: g, dia: dia, i: i };
      });
      filas.sort(function (a, b) { return a.g - b.g || (a.g === 3 ? a.dia - b.dia : 0) || a.i - b.i; });
      filas.forEach(function (x) { tb.appendChild(x.tr); });
    } else t.classList.add(primera === '#' ? 'validar' : 'lista');
  });
  // Cada iniciativa (h3 y lo que sigue hasta el próximo encabezado) en su tarjeta.
  doc.querySelectorAll('h3').forEach(function (h) {
    var card = document.createElement('section'); card.className = 'ini';
    // Las del «Resumen» son tarjetas que no se pliegan.
    var antes = h.previousElementSibling;
    while (antes && antes.tagName !== 'H2') antes = antes.previousElementSibling;
    if (antes && /^\s*Resumen$/i.test(antes.textContent)) card.classList.add('tarjeta');
    h.parentNode.insertBefore(card, h);
    var el = h;
    while (el && !(el !== h && /^H[23]$/.test(el.tagName))) { var sig = el.nextElementSibling; card.appendChild(el); el = sig; }
  });
  // Marcas de cada paso: [hecho] y [en curso]; «Lo siguiente» va en el primero que falta.
  doc.querySelectorAll('.ini ol').forEach(function (ol) {
    var marcado = false;
    var items = Array.prototype.slice.call(ol.querySelectorAll(':scope > li'));
    items.forEach(function (li, i) { li.setAttribute('data-n', String(i + 1)); });
    // Lo que falta primero, en su orden; lo hecho al final, en el orden en que se hizo.
    items.filter(function (li) { return !/^\s*\[hecho\]/.test(li.innerHTML); })
      .concat(items.filter(function (li) { return /^\s*\[hecho\]/.test(li.innerHTML); }))
      .forEach(function (li) { ol.appendChild(li); });
    ol.querySelectorAll(':scope > li').forEach(function (li) {
      var h = li.innerHTML;
      if (/^\s*\[hecho\]\s*/.test(h)) { li.innerHTML = h.replace(/^\s*\[hecho\]\s*/, '<span class="marca hecho">Hecho</span>'); li.classList.add('hecho'); return; }
      if (/^\s*\[en curso\]\s*/.test(h)) { li.innerHTML = h.replace(/^\s*\[en curso\]\s*/, '<span class="marca curso">En curso</span>'); return; }
      if (!marcado) { li.classList.add('sigue'); marcado = true; }
    });
  });

  // Plegables: se abre solo lo que pide revisión (un paso en curso, algo que no está en producción o validaciones
  // pendientes); lo que está en producción y sin nada que hacer queda cerrado, con su resumen al lado del título.
  doc.querySelectorAll('.ini').forEach(function (card) {
    var h = card.querySelector('h3'); if (!h) return;
    var cuerpo = document.createElement('div'); cuerpo.className = 'cuerpo';
    while (h.nextSibling) cuerpo.appendChild(h.nextSibling);
    card.appendChild(cuerpo);
    if (card.classList.contains('tarjeta')) { card.classList.add('abierta'); return; }
    var chip = h.querySelector('.chip.estado'), estado = chip ? chip.textContent.trim() : '';
    var pasos = cuerpo.querySelectorAll('ol > li'), hechos = cuerpo.querySelectorAll('ol > li.hecho').length;
    var enCurso = cuerpo.querySelectorAll('ol > li .marca.curso').length;
    var pruebas = cuerpo.querySelectorAll('table.pruebas tbody tr'), pendientes = cuerpo.querySelectorAll('table.pruebas tbody tr:not(.listo)').length;
    var revisar = enCurso > 0 || pendientes > 0 || (estado && !/^(En producción|Validado)$/.test(estado)) || (!estado && !pruebas.length);
    var r = document.createElement('span'); r.className = 'resumen';
    if (pruebas.length) r.textContent = pendientes ? pendientes + ' por revisar' : 'todo validado';

      cabFl.appendChild(document.createTextNode('.'));
      caja.appendChild(cabFl);
      var filas = [];
      s.ramas.forEach(function (r, i) {
        var fila = [];
        var t = nodo('div', 'fl-rama', r.titulo); t.style.gridRow = String(i + 1); t.style.gridColumn = '2';
        lienzo.appendChild(t); fila.push({ el: t, estado: 'hecho' });
        r.pasos.forEach(function (p, j) {
          var el;
          if (p.pregunta != null) {
            var ya = respondida[p.pregunta];
            el = nodo('div', 'fl-paso fl-dec' + (ya ? ' ya' : ''));
            var rombo = nodo('span', 'fl-rombo'); rombo.appendChild(nodo('span', null, ya ? '✓' : String(p.pregunta))); el.appendChild(rombo);
            var tx = nodo('span', 'fl-tx'); tx.appendChild(nodo('span', 'fl-est', ya ? 'Decidida · ' + p.pregunta : 'Decides tú · pregunta ' + p.pregunta)); tx.appendChild(nodo('span', 'fl-t', p.texto));
            el.appendChild(tx);
            if (pq[p.pregunta]) el.title = textoPlano(pq[p.pregunta]);
          } else {
            el = nodo('div', 'fl-paso fl-' + p.estado);
            el.appendChild(nodo('span', 'fl-est', PASO[p.estado] || p.estado));
            el.appendChild(nodo('span', 'fl-t', p.texto));
          }
          el.style.gridRow = String(i + 1); el.style.gridColumn = String(3 + j);
          lienzo.appendChild(el); fila.push({ el: el, estado: p.pregunta != null && respondida[p.pregunta] ? 'hecho' : p.estado });
        });
        filas.push(fila);
      });
      var une = nodo('div', 'fl-une');
      une.style.gridRow = '1 / span ' + n; une.style.gridColumn = String(3 + largo);
      une.appendChild(nodo('span', 'fl-pto'));
      var ut = nodo('span', 'fl-une-t'); ut.appendChild(nodo('span', 'fl-est', 'Se une en'));
      // Si «se une en» nombra un punto del hilo, lleva a él; si no (el ejecutivo), es solo el nombre de la meta.
      if (hilo[s.seUneEn]) {
        var ir = nodo('button', 'fl-ir', s.seUneEn); ir.type = 'button';
        ir.addEventListener('click', function () { var d = hilo[s.seUneEn]; if (d) { d._abrir(true); d.scrollIntoView({ block: 'center', behavior: suave ? 'smooth' : 'auto' }); } });
        ut.appendChild(ir);
      } else ut.appendChild(nodo('span', 'fl-meta', s.seUneEn));
      une.appendChild(ut);
      lienzo.appendChild(une);
      var svg = document.createElementNS(SVG, 'svg'); svg.setAttribute('class', 'fl-svg'); svg.setAttribute('aria-hidden', 'true');
      lienzo.insertBefore(svg, lienzo.firstChild);
      caja.appendChild(lienzo);
      caja.appendChild(nodo('p', 'fl-nota', 'Línea llena: ya pasó. Punteada: falta. Los rombos son decisiones tuyas; pasa el mouse por uno para leer la pregunta entera.'));

      function dibujar() {
        if (!caja.offsetParent) return;
        var base = lienzo.getBoundingClientRect();
        svg.setAttribute('width', lienzo.scrollWidth); svg.setAttribute('height', lienzo.scrollHeight);
        svg.setAttribute('viewBox', '0 0 ' + lienzo.scrollWidth + ' ' + lienzo.scrollHeight);
        while (svg.firstChild) svg.removeChild(svg.firstChild);
        function caj(el) { var r = el.getBoundingClientRect(); return { l: r.left - base.left, r: r.right - base.left, y: r.top - base.top + r.height / 2 }; }
        function anc(el) { var p = el.querySelector('.fl-pto, .fl-rombo'); return p ? caj(p) : caj(el); }
        function linea(a, b, hecho) {
          var x1 = a.r, y1 = a.y, x2 = b.l, y2 = b.y, dx = Math.max(24, (x2 - x1) / 2);
          var p = document.createElementNS(SVG, 'path');
          p.setAttribute('d', 'M' + x1 + ' ' + y1 + ' C' + (x1 + dx) + ' ' + y1 + ' ' + (x2 - dx) + ' ' + y2 + ' ' + x2 + ' ' + y2);
          p.setAttribute('class', 'fl-l' + (hecho ? '' : ' falta'));
          svg.appendChild(p);
        }
        var o = anc(ori), u = anc(une);
        filas.forEach(function (fila) {
          var todoHecho = true;
          fila.forEach(function (x, k) {
            var b = k === 0 ? caj(x.el) : caj(x.el);
            if (fila[k].estado !== 'hecho') todoHecho = false;
            if (k === 0) linea(o, b, true);
            else linea(caj(fila[k - 1].el), b, x.estado === 'hecho' && todoHecho);
          });
          linea(caj(fila[fila.length - 1].el), u, false);
        });
      }
      flujos.push(dibujar);
      if (window.ResizeObserver) new ResizeObserver(function () { dibujar(); }).observe(lienzo);
      return { el: caja, dibujar: dibujar };
    }

    // ── Una fila del hilo: lo hecho (con fecha) o un punto de lo que sigue (con su número de prioridad). ──
    function item(h, futuro, numero) {
      var i = ini[h.iniciativa] || { nombre: h.iniciativa };
      var li = nodo('li', 'ln-fila ln-item'); li.setAttribute('data-ini', h.iniciativa);
      li.style.setProperty('--c', 'var(--ini-' + h.iniciativa + ')');
      li.appendChild(nodo('div', 'ln-f', futuro ? String(numero) : rango(h)));
      var p = nodo('div', 'ln-p'); p.setAttribute('aria-hidden', 'true'); li.appendChild(p);
      var caja = nodo('div', 'ln-caja'), cab = nodo('button', 'ln-cab'), id = 'ln-det-' + (++nId);
      cab.type = 'button'; cab.setAttribute('aria-expanded', 'false'); cab.setAttribute('aria-controls', id);
      var meta = nodo('span', 'ln-meta'); meta.appendChild(nodo('span', 'ln-ini', i.nombre));
      var abiertas = (h.preguntas || []).filter(function (n) { return pq[n]; });
      var nPreg = abiertas.length + (h.preguntaTexto ? 1 : 0);
      if (futuro) {
        var e = ESTADO[h.estado] || ['', 's-idle'];
        meta.appendChild(nodo('span', 'chip ' + e[1], h.estado === 'espera' && h.esperaA ? 'Espera a ' + h.esperaA : e[0]));
        if (h.ramas) meta.appendChild(nodo('span', 'chip fl-chip', 'Se divide en ' + h.ramas.length));
      } else if (h.prod !== 'si') meta.appendChild(nodo('span', 'chip ' + (h.prod === 'plan' ? 's-idle' : 's-warn'), h.prod === 'plan' ? 'Plan' : h.prod === 'apagado' ? 'Apagado' : 'Una parte apagada'));
      if (nPreg) meta.appendChild(nodo('span', 'chip s-warn', nPreg === 1 ? '1 pregunta para ti' : nPreg + ' preguntas para ti'));
      cab.appendChild(meta); cab.appendChild(nodo('span', 'ln-t', h.titulo)); cab.appendChild(nodo('span', 'ln-d', h.que));
      caja.appendChild(cab);
      var det = nodo('div', 'ln-det'); det.id = id; det.hidden = true;
      det.appendChild(nodo('p', 'ln-que', h.que));
      var fl = futuro && h.ramas ? flujo(h) : null;
      if (fl) det.appendChild(fl.el);
      var dl = nodo('dl', 'ln-dl');
      function fila(k, v) { dl.appendChild(nodo('dt', null, k)); var dd = nodo('dd'); if (typeof v === 'string') dd.textContent = v; else dd.appendChild(v); dl.appendChild(dd); }
      fila('Para quién', h.paraQuien);
      if (futuro) fila('Cómo está', h.estado === 'espera' && h.esperaA ? 'Espera a ' + h.esperaA + '.' : (ESTADO[h.estado] || [''])[0] + '.');
      else fila('En producción', (PROD[h.prod] || '') + (h.prodNota ? '. ' + h.prodNota : '.'));
      if (nPreg && !fl) fila(nPreg === 1 ? 'Pregunta para ti' : 'Preguntas para ti', listaDePreguntas(abiertas, h.preguntaTexto));
      if (h.commits && h.commits.length) {
        var sh = nodo('div', 'ln-shas'); h.commits.forEach(function (c) { sh.appendChild(nodo('code', 'sha', c)); });
        fila('Cambios', sh);
      }
      det.appendChild(dl); caja.appendChild(det); li.appendChild(caja);
      function abrir(si) {
        li.classList.toggle('abierto', si); det.hidden = !si; cab.setAttribute('aria-expanded', String(si));
        if (si && fl) requestAnimationFrame(fl.dibujar);
      }
      cab.addEventListener('click', function () { abrir(det.hidden); });
      li._abrir = abrir;
      if (futuro) hilo[h.titulo] = li; else items.push(li);
      return li;
    }

    var suave = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    var raiz = nodo('div', 'ln-wrap');
    var top = nodo('div', 'ln-top');
    if (bloqueTemas.dondeVamos) top.appendChild(nodo('p', 'ln-donde', bloqueTemas.dondeVamos));
    var est = nodo('div', 'ln-estado');
    var b1 = nodo('span'); b1.innerHTML = 'Hoy es <b>' + fecha(linea.hoy) + '</b>'; est.appendChild(b1);
    var b2 = nodo('span'); b2.appendChild(document.createTextNode('Producción corre ')); b2.appendChild(nodo('code', 'sha', linea.produccion)); est.appendChild(b2);
    est.appendChild(nodo('span', null, linea.sigue.length + ' puntos por delante en el hilo'));
    top.appendChild(est);
    raiz.appendChild(top);

    // Lo que ya pasó, en un desplegable cerrado por defecto: la parte de arriba del hilo.
    var pasado = nodo('details', 'ln-pasado');
    var sm = nodo('summary');
    sm.appendChild(nodo('span', 'ln-pasado-t', 'Lo que ya pasó'));
    var primero = linea.hecho[0], ultimo = linea.hecho[linea.hecho.length - 1];
    sm.appendChild(nodo('span', 'ln-pasado-n', linea.hecho.length + ' hitos' + (primero ? ', del ' + fecha(primero.fecha) + ' ' + primero.fecha.slice(0, 4) + ' al ' + fecha(ultimo.hasta || ultimo.fecha) : '') + ', y los temas que ya funcionan'));
    pasado.appendChild(sm);
    var cuerpo = nodo('div', 'ln-pasado-c');
    var acc = nodo('div', 'ln-acciones');
    var todo = nodo('button', 'ln-btn', 'Abrir todo'); todo.type = 'button'; acc.appendChild(todo);
    cuerpo.appendChild(acc);
    var fil = nodo('div', 'ln-filtros'); fil.setAttribute('role', 'group'); fil.setAttribute('aria-label', 'Ver una iniciativa');
    cuerpo.appendChild(fil);
    var hecho = nodo('ol', 'ln'), mesActual = '', porMes = {};
    linea.hecho.forEach(function (h) {
      var m = h.fecha.slice(0, 7);
      if (m !== mesActual) {
        mesActual = m; var mesLi = nodo('li', 'ln-fila ln-mes'); mesLi.setAttribute('data-mes', m);
        mesLi.appendChild(nodo('div')); var pp = nodo('div', 'ln-p'); pp.setAttribute('aria-hidden', 'true'); mesLi.appendChild(pp);
        var h3 = nodo('h3', null, MES_LARGO[Number(m.slice(5)) - 1] + ' ' + m.slice(0, 4)); h3.appendChild(nodo('span')); mesLi.appendChild(h3);
        hecho.appendChild(mesLi); porMes[m] = mesLi;
      }
      var li = item(h, false); li.setAttribute('data-mes', m); hecho.appendChild(li);
    });
    cuerpo.appendChild(hecho);
    var ya = temas.filter(function (t) { return t.estado === 'funciona' || t.estado === 'terminado'; });
    if (ya.length) {
      cuerpo.appendChild(nodo('h3', 'ln-h3', 'Los temas que ya funcionan'));
      var lista = nodo('div', 'rs-lista');
      ya.forEach(function (t) {
        var f = nodo('div', 'rs-fila');
        f.appendChild(nodo('div', 'rs-nom', t.nombre));
        var falta = nodo('div', 'rs-falta');
        if (t.sigue) { falta.appendChild(nodo('i', null, 'Falta: ')); falta.appendChild(document.createTextNode(t.sigue)); } else falta.textContent = 'Nada pendiente.';
        f.appendChild(falta);
        var e = EST_TEMA[t.estado] || ['', 's-ok'];
        var der = nodo('div', 'rs-der'); der.appendChild(nodo('span', 'chip ' + e[1], e[0])); f.appendChild(der);
        lista.appendChild(f);
      });
      cuerpo.appendChild(lista);
    }
    pasado.appendChild(cuerpo);
    try { pasado.open = localStorage.getItem('roadmap-pasado') === '1'; } catch (e) {}
    pasado.addEventListener('toggle', function () { try { localStorage.setItem('roadmap-pasado', pasado.open ? '1' : '0'); } catch (e) {} lineaRevisar(); });
    raiz.appendChild(pasado);

    // Hoy: donde lo hecho se junta con lo que sigue.
    var hoy = nodo('div', 'ln-fila ln-hoy'); hoy.id = 'hoy-linea';
    hoy.appendChild(nodo('div', 'ln-f', 'Hoy')); var ph = nodo('div', 'ln-p'); ph.setAttribute('aria-hidden', 'true'); hoy.appendChild(ph);
    var hc = nodo('div', 'ln-hoy-caja');
    hc.appendChild(nodo('strong', null, fecha(linea.hoy)));
    var pp1 = nodo('p'); pp1.appendChild(document.createTextNode('Producción corre ')); pp1.appendChild(nodo('code', 'sha', linea.produccion));
    pp1.appendChild(document.createTextNode(': lo que ya pasó está en el desplegable de arriba.')); hc.appendChild(pp1);
    hc.appendChild(nodo('p', null, 'Abajo, el hilo de lo que sigue, en orden de prioridad y sin fechas. Toca un punto para abrirlo; los que dicen «Se divide» se abren en sus ramas.'));
    hoy.appendChild(hc); raiz.appendChild(hoy);
    var sigue = nodo('ol', 'ln futuro');
    linea.sigue.forEach(function (s, i) { sigue.appendChild(item(s, true, i + 1)); });
    raiz.appendChild(sigue);
    paneles.linea.appendChild(raiz);
    window.addEventListener('resize', function () { flujos.forEach(function (f) { f(); }); });

    // El filtro de lo que ya pasó: una iniciativa a la vez; otro clic vuelve a todas. Se recuerda en este navegador.
    var cuenta = {}; items.forEach(function (li) { var k = li.getAttribute('data-ini'); cuenta[k] = (cuenta[k] || 0) + 1; });
    var botones = [], actualFiltro = '';
    function boton(id, nombre, n) {
      var b = nodo('button', 'ln-fil'); b.type = 'button'; b.setAttribute('aria-pressed', 'false');
      if (id) { b.style.setProperty('--c', 'var(--ini-' + id + ')'); b.appendChild(nodo('i')); }
      b.appendChild(document.createTextNode(nombre)); b.appendChild(nodo('span', null, String(n)));
      b.addEventListener('click', function () { filtrar(actualFiltro === id || !id ? '' : id, true); });
      botones.push({ id: id, b: b }); fil.appendChild(b);
    }
    boton('', 'Todas', items.length);
    linea.iniciativas.forEach(function (i) { if (cuenta[i.id]) boton(i.id, i.nombre, cuenta[i.id]); });
    function filtrar(id, guardar) {
      actualFiltro = id;
      botones.forEach(function (x) { x.b.setAttribute('aria-pressed', String(x.id === id)); });
      items.forEach(function (li) { li.hidden = !!id && li.getAttribute('data-ini') !== id; });
      Object.keys(porMes).forEach(function (m) {
        var n = hecho.querySelectorAll('.ln-item[data-mes="' + m + '"]:not([hidden])').length;
        porMes[m].hidden = n === 0; porMes[m].querySelector('h3 span').textContent = n === 1 ? '1 hito' : n + ' hitos';
      });
      if (guardar) { try { localStorage.setItem('roadmap-filtro', id); } catch (e) {} }
    }
    var guardado = ''; try { guardado = localStorage.getItem('roadmap-filtro') || ''; } catch (e) {}
    filtrar(cuenta[guardado] ? guardado : '', false);
    todo.addEventListener('click', function () {
      var abrir = todo.textContent === 'Abrir todo';
      items.forEach(function (li) { if (!li.hidden) li._abrir(abrir); });
      todo.textContent = abrir ? 'Cerrar todo' : 'Abrir todo';
    });

    // ── El resumen ejecutivo (21 nov, pedido de Elías: «muy ejecutivo… agrupar mucho los cambios relacionados»). Arriba,
    //    qué corre, qué está en curso y qué te espera; después, una fila por iniciativa con dónde estamos, lo hecho, lo
    //    que sigue y lo que te toca. Una iniciativa con ramas se abre en su flujo. ──
    var ejEl = document.getElementById('ejecutivo');
    (function pintarEjecutivo() {
      var code = paneles.ejecutivo && paneles.ejecutivo.querySelector('code.language-ejecutivo');
      if (!code || !ejEl) return;
      var ej; try { ej = JSON.parse(code.textContent); } catch (e) { return; }
      var EST = { 'en-curso': ['En curso', 's-info'], 'te-espera': ['Te espera', 's-warn'], 'funciona': ['Funciona', 's-ok'], 'propuesta': ['Por arrancar', 's-idle'] };
      var meta = document.getElementById('meta'); if (meta && ej.corte) meta.textContent = 'Al ' + fecha(ej.corte) + ' ' + ej.corte.slice(0, 4);
      var hoyEj = nodo('div', 'ej-hoy'); hoyEj.id = 'hoy';
      var t1 = nodo('div', 'ej-hoy-1');
      t1.appendChild(nodo('span', 'ej-hoy-et', 'Hoy'));
      t1.appendChild(nodo('h2', 'ej-hoy-f', fecha(ej.corte)));
      var sp = nodo('span', 'ej-hoy-sha'); sp.appendChild(document.createTextNode('Producción corre ')); sp.appendChild(nodo('code', 'sha', ej.produccion)); t1.appendChild(sp);
      hoyEj.appendChild(t1);
      var ul = nodo('ul', 'ej-arriba');
      (ej.arriba || []).forEach(function (l) {
        var li = nodo('li'); var m = l.match(/^([^:]{2,40}):\s*(.*)$/);
        if (m) { li.appendChild(nodo('b', null, m[1] + ': ')); li.appendChild(document.createTextNode(m[2])); } else li.textContent = l;
        ul.appendChild(li);
      });
      hoyEj.appendChild(ul);
      ejEl.appendChild(hoyEj);

      var lista = nodo('div', 'ej-lista');
      ej.iniciativas.forEach(function (i) {
        var fila = nodo('article', 'ej-fila');
        fila.style.setProperty('--c', 'var(--ini-' + i.color + ')');
        var conRamas = i.ramas && i.ramas.length;
        var cab = nodo(conRamas ? 'button' : 'div', 'ej-cab');
        var h = nodo('span', 'ej-nom'); h.appendChild(nodo('span', 'ej-dot')); h.appendChild(nodo('span', 'ej-nom-t', i.nombre));
        var e = EST[i.estado] || ['', 's-idle']; h.appendChild(nodo('span', 'chip ' + e[1], e[0]));
        cab.appendChild(h);
        cab.appendChild(nodo('span', 'ej-donde', i.donde));
        fila.appendChild(cab);
        var cuerpo = nodo('div', 'ej-cuerpo');
        function col(titulo, cls) { var c = nodo('div', 'ej-col ' + cls); c.appendChild(nodo('h4', null, titulo)); cuerpo.appendChild(c); return c; }
        var c1 = col('Lo hecho', 'hecho'), u1 = nodo('ul');
        (i.hecho || []).forEach(function (x) { u1.appendChild(nodo('li', null, x)); }); c1.appendChild(u1);
        var c2 = col('Lo que sigue', 'sigue'), u2 = nodo('ol');
        (i.sigue || []).forEach(function (x) { u2.appendChild(nodo('li', null, x)); }); c2.appendChild(u2);
        var c3 = col('Lo que te toca', 'toca');
        var abiertas = (i.preguntas || []).filter(function (n) { return pq[n]; });
        if (i.teToca) c3.appendChild(nodo('p', 'ej-toca', i.teToca));
        if (abiertas.length) {
          var up = nodo('ul', 'ej-pq');
          abiertas.slice(0, 3).forEach(function (n) {
            var corto = (pq[n].match(/^\*\*(.+?)\*\*/) || [null, pq[n]])[1].replace(/[:.]\s*$/, '');
            var li = nodo('li'); li.title = textoPlano(pq[n]);
            li.appendChild(nodo('b', null, n + ' · ')); li.appendChild(document.createTextNode(textoPlano(corto)));
            up.appendChild(li);
          });
          c3.appendChild(up);
          if (abiertas.length > 3) c3.appendChild(nodo('p', 'ej-mas', 'Y ' + (abiertas.length - 3) + ' más, en el anexo › Roadmap › «Lo que decides tú».'));
        }
        if (!i.teToca && !abiertas.length) c3.appendChild(nodo('p', 'ej-nada', 'Nada por ahora.'));
        fila.appendChild(cuerpo);
        if (conRamas) {
          var fl = flujo({ titulo: i.nombre, ramas: i.ramas, seUneEn: i.seUneEn });
          var caja = nodo('div', 'ej-flujo'); caja.id = 'ej-flujo-' + i.id; caja.hidden = true; caja.appendChild(fl.el);
          fila.appendChild(caja);
          var ver = nodo('button', 'ej-ver', 'Ver sus ramas'); ver.type = 'button';
          c2.appendChild(ver);
          cab.type = 'button'; cab.setAttribute('aria-expanded', 'false'); cab.setAttribute('aria-controls', caja.id);
          var abrir = function () {
            var si = caja.hidden; caja.hidden = !si; fila.classList.toggle('abierta', si);
            cab.setAttribute('aria-expanded', String(si)); ver.textContent = si ? 'Cerrar sus ramas' : 'Ver sus ramas';
            if (si) requestAnimationFrame(fl.dibujar);
          };
          cab.addEventListener('click', abrir); ver.addEventListener('click', abrir);
        }
        lista.appendChild(fila);
      });
      ejEl.appendChild(lista);
    })();

    // «Ir a hoy» lleva arriba, al «Hoy» del resumen ejecutivo; el botón fijo aparece cuando «Hoy» no está a la vista.
    var cta = document.getElementById('ir-hoy');
    var objetivo = document.getElementById('hoy') || hoy;
    function irAHoy(alAbrir) {
      objetivo.scrollIntoView({ block: 'start', behavior: suave && alAbrir !== true ? 'smooth' : 'auto' });
    }
    cta.addEventListener('click', irAHoy);
    var pend = false;
    function revisar() {
      pend = false;
      var r = objetivo.getBoundingClientRect(), alto = window.innerHeight || document.documentElement.clientHeight;
      cta.hidden = r.bottom > 0 && r.top < alto;
      cta.classList.toggle('arriba', r.bottom <= 0);
    }
    function pedir() { if (!pend) { pend = true; requestAnimationFrame(revisar); } }
    window.addEventListener('scroll', pedir, { passive: true }); window.addEventListener('resize', pedir);
    lineaRevisar = pedir;
    lineaIrAHoy = irAHoy;
  }

  // Al abrir: el resumen ejecutivo arriba y el anexo cerrado. Con la dirección de una pestaña (#roadmap, #validar…), el
  // anexo se abre en esa pestaña.
  var anexo = document.getElementById('anexo');
  var inicial = (location.hash || '').slice(1);
  var pedida = PESTANAS.filter(function (p) { return p.id === inicial && !p.oculta; })[0];
  elegir(pedida ? pedida.id : 'linea', false);
  if (pedida && anexo) { anexo.open = true; requestAnimationFrame(function () { anexo.scrollIntoView({ block: 'start' }); }); }
  if (anexo) anexo.addEventListener('toggle', function () { lineaRevisar(); });
  lineaRevisar();
})();
</script>
