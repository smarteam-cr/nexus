<title>Roadmap de Nexus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Vista de docs/roadmap.md. El contenido se edita en roadmap.md y se arma con: node scripts/roadmap-vista.mjs -->
<style>
/* Una columna: para qué, una tarjeta por iniciativa con su camino en orden, y lo que falta probar. */
:root {
  --bg: #f9fafb; --surface: #ffffff; --surface-muted: #f3f4f6; --line: #e5e7eb;
  --fg: #111827; --fg-2: #374151; --fg-muted: #6b7280; --brand: #3b82f6;
  --ok-bg: #ecfdf5; --ok-line: #a7f3d0; --ok-ink: #065f46;
  --info-bg: #eff6ff; --info-line: #bfdbfe; --info-ink: #1e40af;
  --warn-bg: #fffbeb; --warn-line: #fde68a; --warn-ink: #92400e;
  --idle-bg: #f3f4f6; --idle-line: #e5e7eb; --idle-ink: #4b5563;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1220; --surface: #111827; --surface-muted: #1f2937; --line: #1f2937;
  --fg: #f9fafb; --fg-2: #e5e7eb; --fg-muted: #9ca3af; --brand: #60a5fa;
  --ok-bg: #064e3b40; --ok-line: #04785780; --ok-ink: #6ee7b7;
  --info-bg: #1e3a8a40; --info-line: #1d4ed880; --info-ink: #93c5fd;
  --warn-bg: #78350f40; --warn-line: #b4530980; --warn-ink: #fcd34d;
  --idle-bg: #1f2937; --idle-line: #374151; --idle-ink: #d1d5db;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b1220; --surface: #111827; --surface-muted: #1f2937; --line: #1f2937;
  --fg: #f9fafb; --fg-2: #e5e7eb; --fg-muted: #9ca3af; --brand: #60a5fa;
  --ok-bg: #064e3b40; --ok-line: #04785780; --ok-ink: #6ee7b7;
  --info-bg: #1e3a8a40; --info-line: #1d4ed880; --info-ink: #93c5fd;
  --warn-bg: #78350f40; --warn-line: #b4530980; --warn-ink: #fcd34d;
  --idle-bg: #1f2937; --idle-line: #374151; --idle-ink: #d1d5db;
  color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.55; margin: 0; }
main { max-width: 1040px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.head h1 { font-size: 24px; font-weight: 700; margin: 0; }
.head .meta { color: var(--fg-muted); font-size: 13px; }

#doc > h1, #doc > p:first-of-type { display: none; }
#doc h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-muted); margin: 32px 0 10px; }
#doc p, #doc li { color: var(--fg-2); }
#doc strong { color: var(--fg); font-weight: 600; }
#doc ol, #doc ul { padding-left: 22px; margin: 0; }
#doc li { margin: 6px 0; }
#doc code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
.tw { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
#doc table { border-collapse: collapse; width: 100%; }
#doc th { text-align: left; font-size: 12px; font-weight: 600; color: var(--fg-muted); padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-muted); white-space: nowrap; }
#doc td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--fg-2); }
#doc table.lista td:first-child { color: var(--fg); font-weight: 600; white-space: nowrap; }
#doc table.validar td:first-child { color: var(--fg-muted); font-variant-numeric: tabular-nums; width: 1%; }
#doc table.validar td:nth-child(2) { color: var(--fg); font-weight: 600; }
#doc table.pruebas { min-width: 780px; }
#doc table.pruebas td { font-size: 14px; }
#doc table.pruebas td:first-child { color: var(--fg-muted); font-variant-numeric: tabular-nums; width: 1%; }
#doc table.pruebas td:nth-child(2) { width: 1%; white-space: nowrap; }
#doc table.pruebas td:nth-child(3) { color: var(--fg); font-weight: 600; width: 20%; }
#doc table.pruebas td:nth-child(4) { width: 34%; }
.tabs { display: flex; gap: 4px; margin: 20px 0 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { font: inherit; font-size: 14px; font-weight: 600; color: var(--fg-muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--brand); }
.tabs button .n { display: inline-block; margin-left: 6px; font-size: 12px; font-weight: 600; color: var(--info-ink); background: var(--info-bg); border: 1px solid var(--info-line); border-radius: 999px; padding: 0 7px; }
.panel[hidden] { display: none; }
#doc .panel > h2:first-child { margin-top: 20px; }
#doc table.pruebas tr.listo td:not(:nth-child(2)) { color: var(--fg-muted); }
#doc .tw + p { margin-top: 10px; font-size: 13.5px; }
#doc > ul li { margin: 8px 0; }
.ini { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin: 0 0 12px; }
.ini h3 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 16px; font-weight: 650; margin: 0 0 4px; color: var(--fg); }
.ini > p { margin: 0 0 10px; color: var(--fg-muted); font-size: 14px; }
.ini ol { margin: 0; padding-left: 0; list-style: none; counter-reset: paso; }
.ini ol li { counter-increment: paso; position: relative; margin: 0; padding: 7px 0 7px 28px; border-top: 1px solid var(--line); }
.ini ol li::before { content: attr(data-n); position: absolute; left: 0; top: 8px; color: var(--fg-muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.ini ol li.sigue { color: var(--fg); font-weight: 600; }
.ini ol li.hecho { color: var(--fg-muted); }
.ini ol li .marca { display: inline-block; margin-right: 6px; font-size: 11.5px; font-weight: 600; border: 1px solid; border-radius: 999px; padding: 0 8px; vertical-align: 1px; }
.ini ol li .marca.hecho { color: var(--ok-ink); background: var(--ok-bg); border-color: var(--ok-line); }
.ini ol li .marca.curso { color: var(--warn-ink); background: var(--warn-bg); border-color: var(--warn-line); }
.ini ol li.sigue::after { content: "Lo siguiente"; display: block; width: fit-content; margin-top: 4px; font-size: 11.5px; font-weight: 600; color: var(--info-ink); background: var(--info-bg); border: 1px solid var(--info-line); border-radius: 999px; padding: 0 8px; }
.ini .tw { border: 0; border-radius: 0; margin: 0 -18px -16px; border-top: 1px solid var(--line); }
#doc a { color: var(--info-ink); }
#doc tr:last-child td { border-bottom: 0; }
.chip { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
.s-ok { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok-ink); }
.s-info { background: var(--info-bg); border-color: var(--info-line); color: var(--info-ink); }
.s-warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
.s-idle { background: var(--idle-bg); border-color: var(--idle-line); color: var(--idle-ink); }
</style>

<main>
  <div class="head"><h1>Roadmap de Nexus</h1><span class="meta" id="meta"></span></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <article id="doc"></article>
</main>

<script type="text/plain" id="md">@@ROADMAP_MD@@</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function () {
  var md = document.getElementById('md').textContent;
  var doc = document.getElementById('doc');
  doc.innerHTML = marked.parse(md, { gfm: true });

  var corte = md.match(/\*\*Corte:\*\*\s*([0-9-]+)/);
  if (corte) document.getElementById('meta').textContent = 'Al ' + corte[1];

  var TONOS = { 'Validado': 's-ok', 'En producción': 's-info', 'Por desplegar': 's-warn', 'Por empezar': 's-idle' };
  doc.querySelectorAll('span.estado').forEach(function (sp) {
    var e = sp.textContent.trim(); sp.className = 'chip ' + (TONOS[e] || 's-idle');
  });
  doc.querySelectorAll('table').forEach(function (t) {
    var w = document.createElement('div'); w.className = 'tw'; t.parentNode.insertBefore(w, t); w.appendChild(t);
    var th = t.querySelector('thead th'), primera = th ? th.textContent.trim() : '';
    var cabeza = Array.prototype.map.call(t.querySelectorAll('thead th'), function (x) { return x.textContent.trim(); });
    if (cabeza.indexOf('Estado') >= 0) {
      // Las pruebas: el estado como chip (✓ Probado · ↻ Otra vez · Por probar); lo probado, en gris.
      t.classList.add('pruebas');
      t.querySelectorAll('tbody tr').forEach(function (tr) {
        var td = tr.children[1]; if (!td) return;
        var e = td.textContent.trim();
        var tono = /^✓/.test(e) ? 's-ok' : /^↻/.test(e) ? 's-warn' : 's-idle';
        td.innerHTML = '<span class="chip ' + tono + '">' + td.innerHTML + '</span>';
        if (tono === 's-ok') tr.classList.add('listo');
      });
      // Orden: lo que hay que volver a validar, lo que falta, y lo validado al final, por fecha.
      var MESES = { ene: 1, feb: 2, mar: 3, abr: 4, may: 5, jun: 6, jul: 7, ago: 8, sep: 9, oct: 10, nov: 11, dic: 12 };
      var tb = t.querySelector('tbody');
      var filas = Array.prototype.slice.call(tb.children).map(function (tr, i) {
        var e = tr.children[1] ? tr.children[1].textContent.trim() : '';
        var g = /^↻/.test(e) ? 0 : /^✓/.test(e) ? 2 : 1;
        var f = e.match(/(\d{1,2})\s+([a-z]{3})/);
        var dia = f ? (MESES[f[2]] || 0) * 100 + Number(f[1]) : 0;
        return { tr: tr, g: g, dia: dia, i: i };
      });
      filas.sort(function (a, b) { return a.g - b.g || (a.g === 2 ? a.dia - b.dia : 0) || a.i - b.i; });
      filas.forEach(function (x) { tb.appendChild(x.tr); });
    } else t.classList.add(primera === '#' ? 'validar' : 'lista');
  });
  // Cada iniciativa (h3 y lo que sigue hasta el próximo encabezado) en su tarjeta.
  doc.querySelectorAll('h3').forEach(function (h) {
    var card = document.createElement('section'); card.className = 'ini';
    h.parentNode.insertBefore(card, h);
    var el = h;
    while (el && !(el !== h && /^H[23]$/.test(el.tagName))) { var sig = el.nextElementSibling; card.appendChild(el); el = sig; }
  });
  // Marcas de cada paso: [hecho] y [en curso]; «Lo siguiente» va en el primero que falta.
  doc.querySelectorAll('.ini ol').forEach(function (ol) {
    var marcado = false;
    var items = Array.prototype.slice.call(ol.querySelectorAll(':scope > li'));
    items.forEach(function (li, i) { li.setAttribute('data-n', String(i + 1)); });
    // Lo que falta primero, en su orden; lo hecho al final, en el orden en que se hizo.
    items.filter(function (li) { return !/^\s*\[hecho\]/.test(li.innerHTML); })
      .concat(items.filter(function (li) { return /^\s*\[hecho\]/.test(li.innerHTML); }))
      .forEach(function (li) { ol.appendChild(li); });
    ol.querySelectorAll(':scope > li').forEach(function (li) {
      var h = li.innerHTML;
      if (/^\s*\[hecho\]\s*/.test(h)) { li.innerHTML = h.replace(/^\s*\[hecho\]\s*/, '<span class="marca hecho">Hecho</span>'); li.classList.add('hecho'); return; }
      if (/^\s*\[en curso\]\s*/.test(h)) { li.innerHTML = h.replace(/^\s*\[en curso\]\s*/, '<span class="marca curso">En curso</span>'); return; }
      if (!marcado) { li.classList.add('sigue'); marcado = true; }
    });
  });

  // Tres pestañas: el roadmap, lo que le pides al equipo y lo que validas tú. Cada «##» va a la suya.
  var PESTANAS = [
    { id: 'roadmap', nombre: 'Roadmap' },
    { id: 'equipo', nombre: 'Lo que pides al equipo', h2: /pides al equipo/i },
    { id: 'validar', nombre: 'Lo que validas', h2: /validas t/i },
  ];
  var paneles = {};
  PESTANAS.forEach(function (p) { var d = document.createElement('div'); d.className = 'panel'; d.id = 'panel-' + p.id; paneles[p.id] = d; });
  var actual = 'roadmap';
  Array.prototype.slice.call(doc.children).forEach(function (el) {
    if (el.tagName === 'H2') {
      var p = PESTANAS.filter(function (x) { return x.h2 && x.h2.test(el.textContent); })[0];
      actual = p ? p.id : 'roadmap';
    }
    paneles[actual].appendChild(el);
  });
  PESTANAS.forEach(function (p) { doc.appendChild(paneles[p.id]); });
  var faltan = paneles.validar.querySelectorAll('table.pruebas tbody tr:not(.listo)').length;
  var tabs = document.getElementById('tabs');
  function elegir(id, guardar) {
    PESTANAS.forEach(function (p) {
      paneles[p.id].hidden = p.id !== id;
      var b = document.getElementById('tab-' + p.id); if (b) b.setAttribute('aria-selected', String(p.id === id));
    });
    if (guardar) { try { history.replaceState(null, '', '#' + id); } catch (e) {} }
  }
  PESTANAS.forEach(function (p) {
    var b = document.createElement('button');
    b.id = 'tab-' + p.id; b.type = 'button'; b.setAttribute('role', 'tab');
    b.textContent = p.nombre;
    if (p.id === 'validar' && faltan) { var n = document.createElement('span'); n.className = 'n'; n.textContent = faltan + ' por validar'; b.appendChild(n); }
    b.addEventListener('click', function () { elegir(p.id, true); window.scrollTo(0, 0); });
    tabs.appendChild(b);
  });
  var inicial = (location.hash || '').slice(1);
  elegir(PESTANAS.some(function (p) { return p.id === inicial; }) ? inicial : 'roadmap', false);
})();
</script>
